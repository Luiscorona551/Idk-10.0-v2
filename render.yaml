services:
  - type: web
    name: ugs-desktop
    runtime: node
    plan: free
    healthCheckPath: /healthz
    buildCommand: npm ci && npm run validate
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: IDK_VERSION
        value: "10.11.0"
      # Keeps setup sessions valid across restarts.
      - key: SESSION_SECRET
        generateValue: true
      - key: SETUP_KEYS
        sync: false
      # Keep the provider key on the server; it is never shipped to the browser.
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: AI_BASE_URL
        value: https://api.openai.com/v1
